<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background decorative circular blobs -->
  <circle cx="200" cy="150" r="120" fill="#ede9fe" opacity="0.45" />
  <circle cx="280" cy="100" r="45" fill="#fce7f3" opacity="0.6" />
  <circle cx="110" cy="210" r="35" fill="#e0e7ff" opacity="0.6" />

  <!-- Central Quiz Slate Card with shadow -->
  <rect x="90" y="55" width="220" height="190" rx="18" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" filter="url(#aiGlow)" />

  <!-- Card Header Strip -->
  <rect x="90" y="55" width="220" height="42" rx="18" fill="#f8fafc" />
  <circle cx="115" cy="76" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="132" cy="76" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="149" cy="76" r="6" fill="#10b981" opacity="0.8" />
  <rect x="175" y="72" width="110" height="8" rx="4" fill="#cbd5e1" />

  <!-- Simulated Questions Lines inside Slate -->
  <rect x="115" y="115" width="170" height="10" rx="5" fill="#1e293b" opacity="0.8" />
  <rect x="115" y="132" width="120" height="8" rx="4" fill="#64748b" opacity="0.5" />

  <!-- Multiple Choice Options -->
  <rect x="115" y="152" width="80" height="18" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <circle cx="125" cy="161" r="3.5" fill="#3b82f6" />
  <rect x="135" y="158" width="48" height="5" rx="2.5" fill="#2563eb" />

  <rect x="205" y="152" width="80" height="18" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <circle cx="215" cy="161" r="3.5" fill="#10b981" />
  <rect x="225" y="158" width="48" height="5" rx="2.5" fill="#059669" />

  <rect x="115" y="178" width="80" height="18" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="125" cy="187" r="3.5" fill="#cbd5e1" />
  <rect x="135" y="184" width="48" height="5" rx="2.5" fill="#94a3b8" />

  <rect x="205" y="178" width="80" height="18" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="215" cy="187" r="3.5" fill="#cbd5e1" />
  <rect x="225" y="184" width="48" height="5" rx="2.5" fill="#94a3b8" />

  <!-- Action Badge -->
  <rect x="145" y="210" width="110" height="22" rx="11" fill="url(#aiGrad)" />
  <text x="200" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.5">AI GENERATED</text>

  <!-- AI Brain / Chip Symbol floating on top-right -->
  <g transform="translate(280, 40)">
    <circle cx="20" cy="20" r="26" fill="url(#aiGrad)" filter="url(#aiGlow)" />
    <!-- Brain / Neural nodes -->
    <path d="M12 18 C12 14 16 11 20 11 C24 11 28 14 28 18 C28 21 26 23 26 25 C26 27 24 29 20 29 C16 29 14 27 14 25 C14 23 12 21 12 18 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="19" r="2.5" fill="#ffffff" />
    <line x1="20" y1="12" x2="20" y2="16" stroke="#ffffff" stroke-width="1.5" />
    <line x1="14" y1="20" x2="18" y2="20" stroke="#ffffff" stroke-width="1.5" />
    <line x1="22" y1="20" x2="26" y2="20" stroke="#ffffff" stroke-width="1.5" />
    <line x1="20" y1="22" x2="20" y2="27" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Sparkles -->
  <path d="M75 110 L79 119 L88 123 L79 127 L75 136 L71 127 L62 123 L71 119 Z" fill="url(#sparkleGrad)" />
  <path d="M330 180 L333 186 L339 189 L333 192 L330 198 L327 192 L321 189 L327 186 Z" fill="url(#sparkleGrad)" opacity="0.85" />
  <path d="M190 25 L192 29 L196 31 L192 33 L190 37 L188 33 L184 31 L188 29 Z" fill="url(#sparkleGrad)" opacity="0.7" />
</svg>
